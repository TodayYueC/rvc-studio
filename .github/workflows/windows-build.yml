name: Windows development build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate adapter configuration
        run: python -m unittest discover -s backend -p "test_*.py" -v
      - name: Build desktop preview
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: rvc-studio-windows-preview
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
